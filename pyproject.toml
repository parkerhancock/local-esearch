[project]
name = "local-esearch"
version = "0.1.0"
description = "Elasticsearch-compatible API backed by SQLite + FTS5 + sqlite-vec"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
voyage = ["voyageai>=0.2.0"]
gemini = ["google-generativeai>=0.5.0"]
openai = ["openai>=1.0.0"]
vector = ["sqlite-vec>=0.1.0"]
all = [
    "voyageai>=0.2.0",
    "google-generativeai>=0.5.0",
    "openai>=1.0.0",
    "sqlite-vec>=0.1.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_esearch"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=7.0.0",
]
